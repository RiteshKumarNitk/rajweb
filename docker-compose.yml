version: "3.8"

# Local / self-hosting template. Ports are bound to 127.0.0.1: publish the app
# only through a reverse proxy on this host that OVERWRITES X-Forwarded-For
# (nginx: proxy_set_header X-Forwarded-For $remote_addr;) — the rate limiters
# key on it. Secrets and URLs come from the environment (e.g. an untracked
# .env next to this file); nothing secret is committed here.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rra
      POSTGRES_PASSWORD: rra_password
      POSTGRES_DB: rra_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rra -d rra_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rra-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://rra:rra_password@postgres:5432/rra_db?schema=public
      # Required: without AUTH_SECRET sign-in fails closed (no placeholder secret).
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/uploads
      STORAGE_PUBLIC_URL: /uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
